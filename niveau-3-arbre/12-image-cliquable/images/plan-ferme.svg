<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="sillons" width="300" height="16" patternUnits="userSpaceOnUse">
      <rect width="300" height="16" fill="#e6d77a"/>
      <rect y="10" width="300" height="3" fill="#7cb342"/>
    </pattern>
    <pattern id="vitres" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="#e3f2fd"/>
      <path d="M0 0 L25 0 L25 25" fill="none" stroke="#90caf9" stroke-width="2"/>
    </pattern>
    <g id="arbre">
      <circle r="16" fill="#388e3c"/>
      <circle cx="-5" cy="-5" r="6" fill="#66bb6a"/>
      <circle cx="6" cy="4" r="3" fill="#ffb300"/>
    </g>
  </defs>

  <!-- Fond : prairie -->
  <rect width="800" height="500" fill="#cfe8b0"/>
  <!-- Chemin -->
  <path d="M0 275 L800 275" stroke="#e8d9b5" stroke-width="40"/>
  <path d="M375 0 L375 500" stroke="#e8d9b5" stroke-width="40"/>
  <path d="M625 275 L625 500" stroke="#e8d9b5" stroke-width="40"/>

  <!-- Zone 1 : Champ de maïs (rectangle 50,50 → 350,250) -->
  <rect x="50" y="50" width="300" height="200" fill="url(#sillons)" stroke="#827717" stroke-width="3"/>
  <rect x="120" y="132" width="160" height="36" rx="6" fill="#ffffff" opacity="0.85"/>
  <text x="200" y="157" font-size="20" text-anchor="middle" fill="#33691e" font-weight="bold">Champ de maïs</text>

  <!-- Zone 2 : Serre (rectangle 400,50 → 600,200) -->
  <rect x="400" y="50" width="200" height="150" fill="url(#vitres)" stroke="#1e88e5" stroke-width="3"/>
  <rect x="455" y="107" width="90" height="36" rx="6" fill="#ffffff" opacity="0.9"/>
  <text x="500" y="132" font-size="20" text-anchor="middle" fill="#0d47a1" font-weight="bold">Serre</text>

  <!-- Zone 3 : Mare (cercle centre 700,150 rayon 50) -->
  <circle cx="700" cy="150" r="50" fill="#4fc3f7" stroke="#0277bd" stroke-width="3"/>
  <ellipse cx="686" cy="134" rx="14" ry="6" fill="#b3e5fc"/>
  <text x="700" y="157" font-size="20" text-anchor="middle" fill="#01579b" font-weight="bold">Mare</text>

  <!-- Zone 4 : Verger (polygone 50,300 / 300,300 / 350,450 / 50,450) -->
  <polygon points="50,300 300,300 350,450 50,450" fill="#a5d6a7" stroke="#2e7d32" stroke-width="3"/>
  <use href="#arbre" x="90" y="335"/>
  <use href="#arbre" x="150" y="335"/>
  <use href="#arbre" x="210" y="335"/>
  <use href="#arbre" x="270" y="335"/>
  <use href="#arbre" x="90" y="415"/>
  <use href="#arbre" x="290" y="415"/>
  <rect x="122" y="358" width="136" height="36" rx="6" fill="#ffffff" opacity="0.9"/>
  <text x="190" y="383" font-size="20" text-anchor="middle" fill="#1b5e20" font-weight="bold">Verger</text>

  <!-- Zone 5 : Poulailler (rectangle 450,300 → 600,400) -->
  <rect x="450" y="300" width="150" height="100" fill="#d7b98e" stroke="#6d4c41" stroke-width="3"/>
  <path d="M450 300 L525 280 L600 300 Z" fill="#a1887f" stroke="#6d4c41" stroke-width="3"/>
  <rect x="461" y="332" width="128" height="36" rx="6" fill="#ffffff" opacity="0.9"/>
  <text x="525" y="357" font-size="20" text-anchor="middle" fill="#4e342e" font-weight="bold">Poulailler</text>

  <!-- Zone 6 : Accueil (polygone maison 650,350 / 700,300 / 750,350 / 750,450 / 650,450) -->
  <polygon points="650,350 700,300 750,350 750,450 650,450" fill="#ffcc80" stroke="#e65100" stroke-width="3"/>
  <rect x="688" y="410" width="24" height="40" fill="#8d6e63"/>
  <text x="700" y="390" font-size="18" text-anchor="middle" fill="#bf360c" font-weight="bold">Accueil</text>

  <!-- Quadrillage de repérage : une ligne tous les 50 px -->
  <g stroke="#000000" stroke-opacity="0.18" stroke-width="1">
    <path d="M50 0 V500 M100 0 V500 M150 0 V500 M200 0 V500 M250 0 V500 M300 0 V500 M350 0 V500 M400 0 V500 M450 0 V500 M500 0 V500 M550 0 V500 M600 0 V500 M650 0 V500 M700 0 V500 M750 0 V500"/>
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800"/>
  </g>
  <g font-size="11" fill="#37474f">
    <text x="52" y="12">50</text><text x="102" y="12">100</text><text x="152" y="12">150</text><text x="202" y="12">200</text>
    <text x="252" y="12">250</text><text x="302" y="12">300</text><text x="352" y="12">350</text><text x="402" y="12">400</text>
    <text x="452" y="12">450</text><text x="502" y="12">500</text><text x="552" y="12">550</text><text x="602" y="12">600</text>
    <text x="652" y="12">650</text><text x="702" y="12">700</text><text x="752" y="12">750</text>
    <text x="3" y="48">50</text><text x="3" y="98">100</text><text x="3" y="148">150</text><text x="3" y="198">200</text>
    <text x="3" y="248">250</text><text x="3" y="298">300</text><text x="3" y="348">350</text><text x="3" y="398">400</text>
    <text x="3" y="448">450</text>
    <text x="3" y="12" font-weight="bold">0</text>
  </g>
</svg>
